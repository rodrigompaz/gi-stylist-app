7.  Formatea tu respuesta claramente usando Markdown. **MUY IMPORTANTE: Usa saltos de línea (nuevas líneas) para separar párrafos.** Usa `**negrita**` para los títulos de los outfits (ej: **Outfit 1: Título**).

            const userQuery = `

${wardrobeListString}
